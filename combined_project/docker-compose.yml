# Combined pipeline: Kafka (ingest) -> Spark Structured Streaming -> HDFS (store) -> MapReduce on YARN (batch)
# Memory is capped because all containers share one Docker VM of about 4.8 GB.
x-hadoop: &hadoop
  build: ./mapreduce
  image: hadoop-taxi:latest
  env_file: ./hadoop.env
  networks: [bigdata]

x-spark: &spark
  build: ./spark
  image: spark-combined:latest
  user: root
  volumes:
    - ./spark:/opt/app
    - ./producer:/opt/producer
    - ../spark_project/data:/opt/data:ro
    - ./results:/opt/output
  networks: [bigdata]

services:
  # ---------- Ingest ----------
  zookeeper:
    image: bitnamilegacy/zookeeper:3.8
    container_name: zookeeper
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
      - JVMFLAGS=-Xmx200m
    networks: [bigdata]

  kafka:
    image: bitnamilegacy/kafka:3.4
    container_name: kafka
    depends_on: [zookeeper]
    environment:
      - KAFKA_ENABLE_KRAFT=no
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_HEAP_OPTS=-Xmx512m -Xms256m
    networks: [bigdata]

  # ---------- Storage ----------
  namenode:
    <<: *hadoop
    container_name: namenode
    command: ["hdfs", "namenode"]
    hostname: namenode
    ports: ["9870:9870"]
    environment:
      - ENSURE_NAMENODE_DIR=/tmp/hadoop-hadoop/dfs/name

  datanode-1:
    <<: *hadoop
    container_name: datanode-1
    hostname: datanode-1
    command: ["hdfs", "datanode"]
    depends_on: [namenode]

  datanode-2:
    <<: *hadoop
    container_name: datanode-2
    hostname: datanode-2
    command: ["hdfs", "datanode"]
    depends_on: [namenode]

  # ---------- Batch processing (started only for the MapReduce phase) ----------
  resourcemanager:
    <<: *hadoop
    container_name: resourcemanager
    hostname: resourcemanager
    command: ["yarn", "resourcemanager"]
    ports: ["8088:8088"]
    profiles: [batch]

  nodemanager:
    <<: *hadoop
    container_name: nodemanager
    hostname: nodemanager
    command: ["yarn", "nodemanager"]
    ports: ["8042:8042"]
    depends_on: [resourcemanager]
    profiles: [batch]

  # ---------- Stream processing (stopped during the MapReduce phase) ----------
  spark-master:
    <<: *spark
    container_name: cb-spark-master
    hostname: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports: ["8080:8080", "4040:4040"]
    environment:
      - SPARK_MASTER_HOST=spark-master
      - SPARK_DAEMON_MEMORY=256m

  spark-worker:
    <<: *spark
    container_name: cb-spark-worker
    hostname: spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker --cores 2 --memory 1200m spark://spark-master:7077
    ports: ["8081:8081"]
    environment:
      - SPARK_DAEMON_MEMORY=128m
    depends_on: [spark-master]

networks:
  bigdata:
    driver: bridge
